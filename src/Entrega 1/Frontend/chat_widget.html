<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    #cti-chat-widget {
      font-family: "Segoe UI", sans-serif;
      color: #e8eef0;
      pointer-events: none;
    }
    #cti-chat-widget #fab,
    #cti-chat-widget #panel {
      pointer-events: auto;
    }
    #cti-chat-widget #fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      background: #1F4E45;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    }
    #cti-chat-widget #panel {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      width: 340px;
      height: 480px;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      flex-direction: column;
      overflow: hidden;
    }
    #cti-chat-widget #panel.open {
      display: flex;
    }
    #cti-chat-widget header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #1F4E45;
      font-weight: 650;
    }
    #cti-chat-widget header button {
      background: transparent;
      color: #fff;
      border: 0;
      font-size: 16px;
      cursor: pointer;
    }
    #cti-chat-widget #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #cti-chat-widget .bubble {
      max-width: 88%;
      padding: 8px 10px;
      border-radius: 12px;
      line-height: 1.35;
      font-size: 13.5px;
      white-space: pre-wrap;
    }
    #cti-chat-widget .bubble.user {
      align-self: flex-end;
      background: #1F4E45;
    }
    #cti-chat-widget .bubble.assistant {
      align-self: flex-start;
      background: #242c33;
    }
    #cti-chat-widget form {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    #cti-chat-widget input {
      flex: 1;
      border: 0;
      border-radius: 8px;
      padding: 9px 10px;
      background: #0d1117;
      color: #fff;
    }
    #cti-chat-widget form button {
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      background: #1F4E45;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="cti-chat-widget">
    <button id="fab" type="button" aria-label="Assistente CTI">🤖</button>
    <section id="panel">
      <header>
        <span>🤖 Assistente CTI</span>
        <button id="close" type="button" aria-label="Fechar">✖</button>
      </header>
      <div id="msgs"></div>
      <form id="form">
        <input id="box" type="text" placeholder="Pergunte ao Assistente CTI..." autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </section>
  </div>
  <script>
    const root = document.getElementById("cti-chat-widget");
    const fab = root.querySelector("#fab");
    const panel = root.querySelector("#panel");
    const closeBtn = root.querySelector("#close");
    const msgs = root.querySelector("#msgs");
    const form = root.querySelector("#form");
    const box = root.querySelector("#box");
    const API = "http://localhost:8000/api/chat";

    function pinFrame(open) {
      const frame = window.frameElement;
      if (!frame) return;
      const w = open ? "380px" : "76px";
      const h = open ? "540px" : "76px";
      frame.style.position = "fixed";
      frame.style.bottom = "12px";
      frame.style.right = "12px";
      frame.style.width = w;
      frame.style.height = h;
      frame.style.zIndex = "999999";
      frame.style.border = "0";
      frame.style.background = "transparent";
      frame.style.colorScheme = "normal";
      let node = frame.parentElement;
      while (node) {
        node.style.overflow = "visible";
        if (node.getAttribute && node.getAttribute("data-testid") === "stElementContainer") {
          node.style.height = "0px";
          node.style.minHeight = "0px";
          node.style.margin = "0";
          node.style.padding = "0";
          break;
        }
        node = node.parentElement;
      }
    }

    function addBubble(role, text) {
      const el = document.createElement("div");
      el.className = "bubble " + role;
      el.textContent = text;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function setOpen(open) {
      panel.classList.toggle("open", open);
      fab.style.display = open ? "none" : "block";
      pinFrame(open);
      if (open) box.focus();
    }

    let sessionId = localStorage.getItem("cti_chat_session");
    if (!sessionId) {
      sessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("cti_chat_session", sessionId);
    }

    addBubble("assistant", "Olá! Sou o consultor virtual da CTI. Como posso ajudar com os cenários hoje?");
    pinFrame(false);
    fab.addEventListener("click", () => setOpen(true));
    closeBtn.addEventListener("click", () => setOpen(false));

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = box.value.trim();
      if (!message) return;
      box.value = "";
      addBubble("user", message);
      const pending = document.createElement("div");
      pending.className = "bubble assistant";
      pending.textContent = "Pensando...";
      msgs.appendChild(pending);
      msgs.scrollTop = msgs.scrollHeight;
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: message, session_id: sessionId })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        pending.textContent = data.response || "Sem resposta.";
      } catch (err) {
        pending.textContent = "Não consegui falar com o assistente. A API precisa estar em http://localhost:8000.";
      }
      msgs.scrollTop = msgs.scrollHeight;
    });
  </script>
</body>
</html>
