# Dois Web Services. PI4 preserva os modulos/dados compartilhados pelo dashboard.
services:
  - type: web
    name: cti-api
    runtime: python
    plan: free
    rootDir: PI4
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLER
        sync: false
      - key: SUPABASE_REGION
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: EMAIL_ALERTA_CEO
        sync: false

  - type: web
    name: cti-frontend
    runtime: python
    plan: free
    rootDir: PI4
    buildCommand: pip install -r Frontend/requirements.txt && python Backend/scripts/precompute_cache.py
    startCommand: cd Frontend && streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
